[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hushraster"
version = "1.0.1"
description = "A family of compact, raw and error-correcting raster barcode standards and scanner"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "numpy>=1.24"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/gioyous-it/hushraster-python"
Repository = "https://github.com/gioyous-it/hushraster-python"
Issues = "https://github.com/gioyous-it/hushraster-python/issues"
Changelog = "https://github.com/gioyous-it/hushraster-python/blob/main/CHANGELOG.md"
"HushRaster Standard (CC0-1.0)" = "https://github.com/gioyous-it/hushraster-python/blob/main/FORMAT.md"

[project.scripts]
hushraster = "hushraster.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["hushraster"]
include-package-data = true

[tool.setuptools.package-data]
hushraster = ["py.typed"]
