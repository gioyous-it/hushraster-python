name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-matrix-smoke:
    name: Smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]' build
      - name: Build package and check public entry points
        run: |
          python -m build
          python -c "import hushraster; print(hushraster.__version__)"
          hushraster --version
          python -m hushraster --help
          python hushraster.py --help
      - name: Run cross-version smoke and library tests
        run: python -m pytest -q tests/test_cli_smoke.py tests/test_encoder_features.py tests/test_rawbarcode.py

  full-regression-suite:
    name: Full regression suite (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run all tests except the isolated slow crop/resize regression
        run: python -m pytest -q --ignore=tests/test_resize_928_regression.py

  resize-regression:
    name: Slow crop/resize regression (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run crop/resize regression
        run: python -m pytest -q tests/test_resize_928_regression.py
