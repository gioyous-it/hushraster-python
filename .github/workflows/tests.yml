name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Check package build and import
        run: |
          python -m pip install build
          python -m build
          python -c "import hushraster; print(hushraster.__version__); print(hushraster.encode_image)"
          hushraster --version
      - name: Run fast regression tests
        run: |
          python tests/test_compression_recovery.py
          python tests/test_failsafe.py
          python tests/test_encoder_features.py
          python tests/test_resize_928_regression.py
          python tests/test_cli_smoke.py
